      let currentPageLanguage = 'en';
      const userNameStorageKey = 'conni2-user-name';
      let currentUserName = '';
      let hasSavedLanguage = false;
      let currentEventId = '';
      let currentEventName = '';

      function translate(key, values = {}) {
        const pageText = (pageTranslations[currentPageLanguage] || pageTranslations.en)[key];
        const topicText = topicFormTranslations[currentPageLanguage]?.[key] || topicFormTranslations.en[key];
        const locationText = locationFormTranslations[currentPageLanguage]?.[key] || locationFormTranslations.en[key];
        let text = pageText || topicText || locationText || pageTranslations.en[key] || key;
        Object.entries(values).forEach(([name, value]) => {
          text = text.replaceAll(`{${name}}`, value);
        });
        return text;
      }

      function getPageCollationLocale() {
        if (['bar', 'frk', 'hes', 'ksh', 'nds'].includes(currentPageLanguage)) return 'de-DE';
        if (currentPageLanguage === 'fy') return 'nl-NL';
        return currentPageLanguage;
      }

      function sortPageLanguageOptions() {
        const selector = document.getElementById('page-language-filter');
        const selectedLanguage = selector.value;
        const collator = new Intl.Collator(getPageCollationLocale(), { sensitivity: 'base' });
        const options = Array.from(selector.options).sort((a, b) => collator.compare(a.textContent, b.textContent));
        options.forEach(option => selector.append(option));
        selector.value = selectedLanguage;
      }

      function applyPageTranslations() {
        document.documentElement.lang = currentPageLanguage;
        document.documentElement.dir = ['ar', 'he'].includes(currentPageLanguage) ? 'rtl' : 'ltr';
        sortPageLanguageOptions();
        document.querySelectorAll('[data-i18n]').forEach(element => {
          element.textContent = translate(element.dataset.i18n);
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(element => {
          element.placeholder = translate(element.dataset.i18nPlaceholder);
        });

        ['program-language-filter', 'topics-language-filter'].forEach(id => {
          const allOption = document.getElementById(id).querySelector('option[value="all"]');
          if (allOption) allOption.textContent = translate('all');
        });

        const programLikedFilter = document.getElementById('program-liked-filter');
        const topicsLikedFilter = document.getElementById('topics-liked-filter');
        const selectedProgramLikes = programLikedFilter.value;
        const selectedTopicLikes = topicsLikedFilter.value;
        populateLikerFilters();
        if (Array.from(programLikedFilter.options).some(option => option.value === selectedProgramLikes)) {
          programLikedFilter.value = selectedProgramLikes;
        }
        if (Array.from(topicsLikedFilter.options).some(option => option.value === selectedTopicLikes)) {
          topicsLikedFilter.value = selectedTopicLikes;
        }

        document.getElementById('user-name-status').textContent = currentUserName ? translate('saved') : '';

        if (window.allProgramItems) {
          renderCurrentViews();
          renderLocations(window.allLocations || []);
        }
      }

      function initializePageLanguage() {
        const selector = document.getElementById('page-language-filter');
        try {
          const savedLanguage = localStorage.getItem(pageLanguageStorageKey);
          if (pageTranslations[savedLanguage]) {
            currentPageLanguage = savedLanguage;
            hasSavedLanguage = true;
          }
        } catch {
          currentPageLanguage = 'en';
        }
        selector.value = currentPageLanguage;
        selector.addEventListener('change', () => {
          currentPageLanguage = selector.value;
          hasSavedLanguage = true;
          try {
            localStorage.setItem(pageLanguageStorageKey, currentPageLanguage);
          } catch {}
          applyPageTranslations();
        });
        applyPageTranslations();
      }

      function currentUserKey() {
        return currentUserName.trim().toLocaleLowerCase();
      }

      function eventApiUrl(path) {
        return `${path}?eventId=${encodeURIComponent(currentEventId)}`;
      }

      let availableEvents = [];

      function openEventChooser() {
        document.getElementById('event-setup-overlay').hidden = false;
        document.getElementById('profile-setup-step').hidden = true;
        document.getElementById('event-setup-step').hidden = false;
        document.getElementById('event-setup-status').textContent = '';
        loadEventChoices();
      }

      async function loadEventChoices() {
        const status = document.getElementById('event-setup-status');
        const selector = document.getElementById('event-select');
        try {
          const response = await fetch('/api/events');
          if (!response.ok) throw new Error(translate('eventLoadFailed'));
          const result = await response.json();
          availableEvents = result.events;
          selector.replaceChildren();
          if (!availableEvents.length) {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = translate('noEvents');
            selector.append(option);
            selector.disabled = true;
            document.querySelector('#event-select-form button[type="submit"]').disabled = true;
            return;
          }

          availableEvents.forEach(event => {
            const option = document.createElement('option');
            option.value = event.id;
            option.textContent = event.name;
            selector.append(option);
          });
          selector.disabled = false;
          document.querySelector('#event-select-form button[type="submit"]').disabled = false;
          try {
            const previousEventId = localStorage.getItem('conni2-event-id');
            if (availableEvents.some(event => event.id === previousEventId)) {
              selector.value = previousEventId;
            }
          } catch {}
          status.textContent = '';
        } catch (error) {
          status.textContent = error.message || translate('eventLoadFailed');
        }
      }

      async function activateEvent(event) {
        currentEventId = event.id;
        currentEventName = event.name;
        try {
          localStorage.setItem('conni2-event-id', currentEventId);
        } catch {}
        document.getElementById('current-event-name').textContent = currentEventName;
        document.getElementById('managed-event-name').value = currentEventName;
        document.getElementById('event-controls').hidden = false;
        document.getElementById('event-setup-overlay').hidden = true;
        await loadData();
      }

      function initializeEventFlow() {
        const nameInput = document.getElementById('setup-user-name');
        const languageSelect = document.getElementById('setup-favorite-language');
        const pageLanguageSelect = document.getElementById('page-language-filter');
        nameInput.value = currentUserName;
        Array.from(pageLanguageSelect.options).forEach(sourceOption => {
          const option = sourceOption.cloneNode(true);
          languageSelect.append(option);
        });
        languageSelect.value = currentPageLanguage;

        if (currentUserName && hasSavedLanguage) {
          openEventChooser();
        } else {
          document.getElementById('profile-setup-step').hidden = false;
          document.getElementById('event-setup-step').hidden = true;
        }

        document.getElementById('profile-setup-form').addEventListener('submit', event => {
          event.preventDefault();
          currentUserName = nameInput.value.trim();
          currentPageLanguage = languageSelect.value;
          hasSavedLanguage = true;
          document.getElementById('current-user-name').value = currentUserName;
          pageLanguageSelect.value = currentPageLanguage;
          try {
            localStorage.setItem(userNameStorageKey, currentUserName);
            localStorage.setItem(pageLanguageStorageKey, currentPageLanguage);
          } catch {
            document.getElementById('user-name-status').textContent = translate('nameStorageUnavailable');
          }
          applyPageTranslations();
          openEventChooser();
        });

        document.getElementById('event-select-form').addEventListener('submit', event => {
          event.preventDefault();
          const chosenEvent = availableEvents.find(candidate =>
            candidate.id === document.getElementById('event-select').value
          );
          if (chosenEvent) activateEvent(chosenEvent);
        });

        document.getElementById('event-create-form').addEventListener('submit', async event => {
          event.preventDefault();
          const form = event.currentTarget;
          const submitButton = form.querySelector('button[type="submit"]');
          const status = document.getElementById('event-setup-status');
          submitButton.disabled = true;
          status.textContent = '';
          try {
            const response = await fetch('/api/events', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: new FormData(form).get('name') })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || translate('eventSaveFailed'));
            form.reset();
            await activateEvent(result.event);
          } catch (error) {
            status.textContent = error.message || translate('eventSaveFailed');
          } finally {
            submitButton.disabled = false;
          }
        });

        document.getElementById('switch-event-button').addEventListener('click', openEventChooser);
        document.getElementById('event-rename-form').addEventListener('submit', async event => {
          event.preventDefault();
          const form = event.currentTarget;
          const status = document.getElementById('event-manage-status');
          const submitButton = form.querySelector('button[type="submit"]');
          submitButton.disabled = true;
          status.textContent = '';
          try {
            const response = await fetch('/api/events', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                eventId: currentEventId,
                name: new FormData(form).get('name')
              })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || translate('eventSaveFailed'));
            currentEventName = result.event.name;
            document.getElementById('current-event-name').textContent = currentEventName;
            document.getElementById('managed-event-name').value = currentEventName;
            status.textContent = translate('eventSaved');
          } catch (error) {
            status.textContent = error.message || translate('eventSaveFailed');
          } finally {
            submitButton.disabled = false;
          }
        });

        document.getElementById('delete-event-button').addEventListener('click', async event => {
          if (!window.confirm(translate('deleteEventConfirm', { name: currentEventName }))) return;
          const button = event.currentTarget;
          const status = document.getElementById('event-manage-status');
          button.disabled = true;
          status.textContent = '';
          try {
            const response = await fetch('/api/events', {
              method: 'DELETE',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ eventId: currentEventId })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || translate('eventSaveFailed'));
            try {
              localStorage.removeItem('conni2-event-id');
            } catch {}
            openEventChooser();
          } catch (error) {
            status.textContent = error.message || translate('eventSaveFailed');
          } finally {
            button.disabled = false;
          }
        });
      }

      function renderCurrentViews() {
        if (!window.allProgramItems) return;

        renderProgram(
          window.allProgramItems,
          document.getElementById('program-language-filter').value,
          document.getElementById('program-detail-filter').value,
          document.getElementById('program-search-filter').value,
          document.getElementById('program-liked-filter').value
        );
        renderTopics(
          window.allTopics || [],
          document.getElementById('topics-language-filter').value,
          document.getElementById('topics-sort-select').value,
          document.getElementById('topics-type-filter').value === 'topics-only',
          document.getElementById('topics-detail-filter').value,
          document.getElementById('topics-search-filter').value,
          document.getElementById('topics-liked-filter').value
        );
      }

      function getItemLikeState(item, itemType) {
        const nameKey = currentUserKey();
        const likers = item.likers || [];
        const likeCount = Number(item.likeCount);
        const liked = !!nameKey && likers.some(liker => liker.toLocaleLowerCase() === nameKey);
        return { liked, likeCount: Number.isFinite(likeCount) ? likeCount : likers.length, likers };
      }

      function renderLikeControl(item, itemType) {
        const state = getItemLikeState(item, itemType);
        const likerNames = state.likers.join(', ') || translate('noLikerNames');
        const tooltip = escapeAttributeValue(translate('likedByTooltip', { names: likerNames }));
        const buttonTitle = currentUserName
          ? translate(state.liked ? 'unlikeTitle' : 'likeTitle')
          : translate('setNameFirst');

        return `
          <div class="like-actions">
            <button
              class="like-toggle"
              type="button"
              data-like-type="${itemType}"
              data-like-name="${escapeAttributeValue(item.name)}"
              aria-pressed="${state.liked}"
              title="${escapeAttributeValue(buttonTitle)}"
              ${currentUserName ? '' : 'disabled'}
            >${translate(state.liked ? 'unlikeAction' : 'likeAction')}</button>
            <p class="likes" title="${tooltip}">♥ ${translate('likesCount', { count: state.likeCount })}</p>
          </div>
        `;
      }

      function renderDeleteControl(item, itemType) {
        if (!canManageItem(item)) return '';

        const label = translate('deleteItem');
        return `
          <button
            class="delete-item"
            type="button"
            data-delete-type="${itemType}"
            data-delete-name="${escapeAttributeValue(item.name)}"
            aria-label="${escapeAttributeValue(label)}: ${escapeAttributeValue(item.name)}"
            title="${escapeAttributeValue(label)}"
          >${label}</button>
        `;
      }

      function renderItemEditor(item, itemType) {
        if (!canManageItem(item)) return '';

        const isProgram = itemType === 'program';
        const locations = (window.allLocations || []).map(location => `
          <option value="${escapeAttributeValue(location.name)}" ${item.location === location.name ? 'selected' : ''}>${escapeAttributeValue(location.capacity != null
            ? `${location.name} (${translate('capacity')} ${new Intl.NumberFormat(getPageCollationLocale()).format(location.capacity)})`
            : location.name)}</option>
        `).join('');
        return `
          <details class="item-editor">
            <summary>${translate('editItem')}</summary>
            <form class="item-editor-form" data-edit-type="${itemType}" data-edit-name="${escapeAttributeValue(item.name)}">
              <div class="item-editor-fields">
                <div class="item-editor-field">
                  <label>${translate('name')}</label>
                  <input name="name" type="text" maxlength="160" value="${escapeAttributeValue(item.name)}" required />
                </div>
                <div class="item-editor-field">
                  <label>${translate('contributors')}</label>
                  <input name="contributors" type="text" value="${escapeAttributeValue((item.contributers || []).join(', '))}" />
                </div>
                <div class="item-editor-field">
                  <label>${translate('language')}</label>
                  <input name="languages" type="text" value="${escapeAttributeValue((item.languages || []).join(', '))}" />
                </div>
                <div class="item-editor-field item-editor-description">
                  <label>${translate('topicDescription')}</label>
                  <textarea name="description" rows="3" maxlength="4000">${escapeAttributeValue(item.desc || '')}</textarea>
                </div>
              </div>
              ${isProgram ? '' : `
                <label class="item-editor-move">
                  <input type="checkbox" name="moveToProgram" /> ${translate('moveToProgram')}
                </label>
              `}
              <div class="item-editor-schedule" ${isProgram ? '' : 'hidden'}>
                <div class="item-editor-field">
                  <label>${translate('location')}</label>
                  <select name="location" ${isProgram ? 'required' : ''}>
                    <option value=""></option>${locations}
                  </select>
                </div>
                <div class="item-editor-field">
                  <label>${translate('date')}</label>
                  <input name="date" type="date" value="${escapeAttributeValue(item.date || '')}" ${isProgram ? 'required' : ''} />
                </div>
                <div class="item-editor-field">
                  <label>${translate('startTime')}</label>
                  <input name="start" type="time" value="${escapeAttributeValue(item.start || '')}" ${isProgram ? 'required' : ''} />
                </div>
                <div class="item-editor-field">
                  <label>${translate('endTime')}</label>
                  <input name="end" type="time" value="${escapeAttributeValue(item.end || '')}" ${isProgram ? 'required' : ''} />
                </div>
              </div>
              <button class="save-item" type="submit">${translate('saveItem')}</button>
              <p class="item-editor-status" role="status" aria-live="polite"></p>
            </form>
          </details>
        `;
      }

      async function saveItem(form) {
        const sourceType = form.dataset.editType;
        const itemName = form.dataset.editName;
        const formData = new FormData(form);
        const splitValues = value => value.split(',').map(part => part.trim()).filter(Boolean);
        const moveToProgram = formData.get('moveToProgram') === 'on';
        const targetType = sourceType === 'topics' && !moveToProgram ? 'topics' : 'program';
        const status = form.querySelector('.item-editor-status');
        const saveButton = form.querySelector('.save-item');
        saveButton.disabled = true;
        status.textContent = '';

        try {
          const response = await fetch(eventApiUrl('/api/items'), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemType: sourceType,
              targetType,
              itemName,
              name: formData.get('name'),
              description: formData.get('description'),
              contributors: splitValues(formData.get('contributors')),
              languages: splitValues(formData.get('languages')),
              location: formData.get('location'),
              date: formData.get('date'),
              start: formData.get('start'),
              end: formData.get('end')
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || translate('itemSaveFailed'));

          const sourceItems = sourceType === 'program' ? window.allProgramItems : window.allTopics;
          const targetItems = targetType === 'program' ? window.allProgramItems : window.allTopics;
          const remainingItems = sourceItems.filter(item => item.name !== itemName);
          if (sourceType === targetType) {
            const index = sourceItems.findIndex(item => item.name === itemName);
            sourceItems[index] = result.item;
          } else {
            window[sourceType === 'program' ? 'allProgramItems' : 'allTopics'] = remainingItems;
            targetItems.push(result.item);
          }

          populateLanguageFilters(window.allProgramItems || [], window.allTopics || []);
          renderCurrentViews();
          renderLocations(window.allLocations || []);
          document.getElementById('user-name-status').textContent = translate('itemSaved');
        } catch (error) {
          status.textContent = error.message || translate('itemSaveFailed');
        } finally {
          if (saveButton.isConnected) saveButton.disabled = false;
        }
      }

      function attachItemEditorHandlers(root) {
        root.querySelectorAll('.item-editor-form').forEach(form => {
          const moveToggle = form.querySelector('[name="moveToProgram"]');
          const scheduleFields = form.querySelector('.item-editor-schedule');
          if (moveToggle) {
            moveToggle.addEventListener('change', () => {
              scheduleFields.hidden = !moveToggle.checked;
              scheduleFields.querySelectorAll('input, select').forEach(field => {
                field.required = moveToggle.checked;
              });
            });
          }
          form.addEventListener('submit', event => {
            event.preventDefault();
            saveItem(form);
          });
        });
      }

      async function deleteItem(itemType, itemName) {
        try {
          const response = await fetch(eventApiUrl('/api/items'), {
            method: 'DELETE',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ itemType, itemName })
          });
          if (!response.ok) throw new Error('Delete failed');

          const result = await response.json();
          const programLanguage = document.getElementById('program-language-filter').value;
          const programLikedBy = document.getElementById('program-liked-filter').value;
          const topicsLanguage = document.getElementById('topics-language-filter').value;
          const topicsLikedBy = document.getElementById('topics-liked-filter').value;

          if (result.itemType === 'program') {
            window.allProgramItems = (window.allProgramItems || []).filter(item => item.name !== result.item.name);
          } else {
            window.allTopics = (window.allTopics || []).filter(item => item.name !== result.item.name);
          }

          populateLanguageFilters(window.allProgramItems || [], window.allTopics || []);
          const restoreSelection = (id, value) => {
            const select = document.getElementById(id);
            if (Array.from(select.options).some(option => option.value === value)) select.value = value;
          };
          restoreSelection('program-language-filter', programLanguage);
          restoreSelection('program-liked-filter', programLikedBy);
          restoreSelection('topics-language-filter', topicsLanguage);
          restoreSelection('topics-liked-filter', topicsLikedBy);
          renderCurrentViews();
          if (result.itemType === 'program') renderLocations(window.allLocations || []);
          document.getElementById('user-name-status').textContent = translate('itemDeleted');
          return true;
        } catch {
          document.getElementById('user-name-status').textContent = translate('deleteFailed');
          return false;
        }
      }

      function attachDeleteHandlers(root) {
        root.querySelectorAll('.delete-item').forEach(button => {
          button.addEventListener('click', async () => {
            const itemName = button.dataset.deleteName;
            if (!window.confirm(translate('deleteConfirm', { name: itemName }))) return;

            button.disabled = true;
            await deleteItem(button.dataset.deleteType, itemName);
            if (button.isConnected) button.disabled = false;
          });
        });
      }

      async function toggleItemLike(itemType, itemName) {
        if (!currentUserName) return;
        const items = itemType === 'program' ? window.allProgramItems || [] : window.allTopics || [];
        const item = items.find(candidate => candidate.name === itemName);
        if (!item) return;

        try {
          const response = await fetch(eventApiUrl('/api/like'), {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemType,
              itemName,
              userName: currentUserName,
              liked: !getItemLikeState(item, itemType).liked
            })
          });
          if (!response.ok) throw new Error('Could not save like');

          const result = await response.json();
          const updatedItems = result.itemType === 'program' ? window.allProgramItems : window.allTopics;
          const updatedItem = updatedItems.find(candidate => candidate.name === result.item.name);
          if (updatedItem) Object.assign(updatedItem, result.item);

          document.getElementById('user-name-status').textContent = translate('saved');
          renderCurrentViews();
        } catch {
          document.getElementById('user-name-status').textContent = translate('likesSaveFailed');
        }
      }

      function attachLikeHandlers(root) {
        root.querySelectorAll('.like-toggle').forEach(button => {
          button.addEventListener('click', async () => {
            button.disabled = true;
            await toggleItemLike(button.dataset.likeType, button.dataset.likeName);
            if (button.isConnected) button.disabled = !currentUserName;
          });
        });
      }

      function initializeUserName() {
        const nameInput = document.getElementById('current-user-name');
        const status = document.getElementById('user-name-status');
        try {
          currentUserName = localStorage.getItem(userNameStorageKey) || '';
          status.textContent = currentUserName ? translate('saved') : '';
        } catch {
          status.textContent = translate('nameStorageUnavailable');
        }
        nameInput.value = currentUserName;

        nameInput.addEventListener('input', () => {
          currentUserName = nameInput.value.trim();
          try {
            if (currentUserName) {
              localStorage.setItem(userNameStorageKey, currentUserName);
              status.textContent = translate('saved');
            } else {
              localStorage.removeItem(userNameStorageKey);
              status.textContent = '';
            }
          } catch {
            status.textContent = translate('nameStorageUnavailable');
          }

          if (!window.allProgramItems) return;

          populateLikerFilters();
          renderCurrentViews();
        });
      }

      function initializeTopicCreation() {
        const form = document.getElementById('create-topic-form');
        const submitButton = form.querySelector('button[type="submit"]');
        const status = document.getElementById('topic-create-status');

        form.addEventListener('submit', async event => {
          event.preventDefault();
          submitButton.disabled = true;
          status.textContent = '';

          const previousProgramLanguage = document.getElementById('program-language-filter').value;
          const previousProgramLikedBy = document.getElementById('program-liked-filter').value;
          const formData = new FormData(form);
          const splitValues = value => value.split(',').map(part => part.trim()).filter(Boolean);

          try {
            const response = await fetch(eventApiUrl('/api/topics'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: formData.get('name'),
                description: formData.get('description'),
                contributors: splitValues(formData.get('contributors')),
                languages: splitValues(formData.get('languages'))
              })
            });
            if (!response.ok) throw new Error('Topic creation failed');

            const result = await response.json();
            window.allTopics.push(result.topic);
            populateLanguageFilters(window.allProgramItems || [], window.allTopics);

            const programLanguageFilter = document.getElementById('program-language-filter');
            if (Array.from(programLanguageFilter.options).some(option => option.value === previousProgramLanguage)) {
              programLanguageFilter.value = previousProgramLanguage;
            }
            document.getElementById('program-liked-filter').value = previousProgramLikedBy;
            document.getElementById('topics-language-filter').value = 'all';
            document.getElementById('topics-liked-filter').value = 'all';
            document.getElementById('topics-search-filter').value = '';
            document.getElementById('topics-type-filter').value = 'topics-only';

            form.reset();
            renderCurrentViews();
            status.textContent = translate('topicSaved');
            form.closest('details').open = false;
          } catch {
            status.textContent = translate('topicCreateError');
          } finally {
            submitButton.disabled = false;
          }
        });
      }

      async function loadData() {
        try {
          const response = await fetch(`/api/event?eventId=${encodeURIComponent(currentEventId)}`);
          if (!response.ok) {
            throw new Error('Could not load event data');
          }

          const data = await response.json();
          window.allProgramItems = data.event.program || [];
          window.allTopics = data.event.topics || [];
          window.allLocations = data.event.locations || [];
          populateLanguageFilters(window.allProgramItems, window.allTopics);
          renderProgram(window.allProgramItems);
          renderTopics(window.allTopics);
          renderLocations(window.allLocations);
        } catch (error) {
          document.getElementById('program-cards').innerHTML = `<p class="loading">${translate('loadError')}</p>`;
          document.getElementById('topics-cards').innerHTML = `<p class="loading">${translate('loadError')}</p>`;
          document.getElementById('locations-cards').innerHTML = `<p class="loading">${translate('loadError')}</p>`;
        }
      }

      function populateLikerFilters() {
        const personalizedOptionState = currentUserName ? '' : 'disabled';
        const likerOptions = [
          `<option value="my-likes-and-contribution" ${personalizedOptionState}>${translate('myLikesAndContribution')}</option>`,
          `<option value="my-likes" ${personalizedOptionState}>${translate('myLikes')}</option>`,
          `<option value="my-contribution" ${personalizedOptionState}>${translate('myContribution')}</option>`,
          `<option value="all">${translate('all')}</option>`
        ]
          .join('');

        const programLikedFilter = document.getElementById('program-liked-filter');
        const topicsLikedFilter = document.getElementById('topics-liked-filter');
        const selectedProgramFilter = programLikedFilter.value;
        const selectedTopicsFilter = topicsLikedFilter.value;
        programLikedFilter.innerHTML = likerOptions;
        topicsLikedFilter.innerHTML = likerOptions;
        programLikedFilter.value = Array.from(programLikedFilter.options)
          .some(option => option.value === selectedProgramFilter && !option.disabled)
          ? selectedProgramFilter
          : 'all';
        topicsLikedFilter.value = Array.from(topicsLikedFilter.options)
          .some(option => option.value === selectedTopicsFilter && !option.disabled)
          ? selectedTopicsFilter
          : 'all';
      }

      function populateLanguageFilters(programItems, topicItems) {
        const allLanguages = new Set();
        [...programItems, ...topicItems].forEach(item => {
          (item.languages || []).forEach(language => allLanguages.add(language));
        });

        const programSelect = document.getElementById('program-language-filter');
        const programLikedFilter = document.getElementById('program-liked-filter');
        const programSearch = document.getElementById('program-search-filter');
        const programDetailFilter = document.getElementById('program-detail-filter');
        const programViewFilter = document.getElementById('program-view-filter');
        const topicSelect = document.getElementById('topics-language-filter');
        const topicsLikedFilter = document.getElementById('topics-liked-filter');
        const topicsSearch = document.getElementById('topics-search-filter');
        const topicsDetailFilter = document.getElementById('topics-detail-filter');
        const topicsTypeFilter = document.getElementById('topics-type-filter');
        const topicsSortSelect = document.getElementById('topics-sort-select');

        const collator = new Intl.Collator(getPageCollationLocale(), { sensitivity: 'base' });
        const languages = Array.from(allLanguages).sort((a, b) => collator.compare(a, b));
        const options = [`<option value="all">${translate('all')}</option>`]
          .concat(languages.map(language => `<option value="${escapeAttributeValue(language)}">${escapeAttributeValue(language)}</option>`))
          .join('');

        programSelect.innerHTML = options;
        topicSelect.innerHTML = options;
        populateLikerFilters();

        programSelect.onchange = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        programLikedFilter.onchange = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        programSearch.oninput = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        programDetailFilter.onchange = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        programViewFilter.onchange = () => renderProgram(programItems, programSelect.value, programDetailFilter.value, programSearch.value, programLikedFilter.value);
        topicSelect.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsLikedFilter.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsSearch.oninput = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsDetailFilter.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsTypeFilter.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
        topicsSortSelect.onchange = () => renderTopics(topicItems, topicSelect.value, topicsSortSelect.value, topicsTypeFilter.value === 'topics-only', topicsDetailFilter.value, topicsSearch.value, topicsLikedFilter.value);
      }

      function matchesSearch(item, query) {
        const normalizedQuery = query.trim().toLocaleLowerCase();
        if (!normalizedQuery) return true;

        const searchableText = [item.name, item.desc, ...(item.contributers || [])]
          .filter(Boolean)
          .join(' ')
          .toLocaleLowerCase();
        return searchableText.includes(normalizedQuery);
      }

      function matchesLikedBy(item, likedBy, itemType) {
        if (likedBy === 'all') return true;
        if (!currentUserName) return false;

        const userKey = currentUserKey();
        const liked = getItemLikeState(item, itemType).liked;
        if (likedBy === 'my-likes') return liked;

        const contributed = (item.contributers || []).some(contributor =>
          contributor.trim().toLocaleLowerCase() === userKey
        );
        if (likedBy === 'my-contribution') return contributed;
        return likedBy === 'my-likes-and-contribution' && (liked || contributed);
      }

      function canManageItem(item) {
        if (!currentUserName) return false;

        const userKey = currentUserKey();
        return (item.contributers || []).some(contributor =>
          contributor.trim().toLocaleLowerCase() === userKey
        );
      }

      function escapeAttributeValue(value) {
        return String(value).replace(/[&<>"']/g, character => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[character]);
      }

      function getSortDateTimeValue(item) {
        const date = item.date || '0000-00-00';
        const time = item.start || '00:00';
        const normalizedDate = date.split('.').reverse().join('-');
        const [hour = '00', minute = '00'] = time.split(':');
        return `${normalizedDate}T${hour.padStart(2, '0')}:${minute.padStart(2, '0')}:00`;
      }

      function formatProgramDate(dateValue) {
        const [year, month, day] = (dateValue || '').split('-').map(Number);
        if (!year || !month || !day) return dateValue || 'Date not set';

        const germanDialects = ['bar', 'frk', 'hes', 'ksh', 'nds'];
        const fallbackLocale = currentPageLanguage === 'fy' ? 'nl-NL' : 'de-DE';
        const dateLocale = germanDialects.includes(currentPageLanguage)
          ? 'de-DE'
          : Intl.DateTimeFormat.supportedLocalesOf([currentPageLanguage]).length
            ? currentPageLanguage
            : fallbackLocale;
        return new Intl.DateTimeFormat(dateLocale, {
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        }).format(new Date(year, month - 1, day));
      }

      function renderProgramCalendar(items) {
        const days = new Map();
        items.forEach(item => {
          const date = item.date || translate('dateNotSet');
          if (!days.has(date)) days.set(date, []);
          days.get(date).push(item);
        });

        return `
          <div class="program-calendar">
            ${Array.from(days, ([date, dayItems]) => `
              <section class="calendar-day">
                <h3>${formatProgramDate(date)}</h3>
                <div class="calendar-events">
                  ${dayItems.map(item => `
                    <article class="calendar-event" data-program-name="${escapeAttributeValue(item.name)}">
                      <span class="calendar-time">${escapeAttributeValue(item.start || '')}${item.end ? ` - ${escapeAttributeValue(item.end)}` : ''}</span>
                      <strong>${escapeAttributeValue(item.name)}</strong>
                      ${item.location ? `<a href="#" class="chip-link" data-location="${escapeAttributeValue(item.location)}">${escapeAttributeValue(item.location)}</a>` : ''}
                      ${renderLikeControl(item, 'program')}
                      ${renderItemEditor(item, 'program')}
                      ${renderDeleteControl(item, 'program')}
                    </article>
                  `).join('')}
                </div>
              </section>
            `).join('')}
          </div>
        `;
      }

      function renderProgram(items, selectedLanguage = 'all', detailMode = 'full', searchText = '', likedBy = 'all') {
        const root = document.getElementById('program-cards');
        const viewMode = document.getElementById('program-view-filter').value;
        document.getElementById('program-detail-filter-group').hidden = viewMode === 'calendar';
        const filteredItems = (selectedLanguage === 'all'
          ? items
          : items.filter(item => (item.languages || []).includes(selectedLanguage)))
          .filter(item => matchesSearch(item, searchText))
          .filter(item => matchesLikedBy(item, likedBy, 'program'))
          .slice()
          .sort((a, b) => new Date(getSortDateTimeValue(a)) - new Date(getSortDateTimeValue(b)));

        document.getElementById('program-item-count').textContent = translate('itemsShown', {
          count: new Intl.NumberFormat(getPageCollationLocale()).format(filteredItems.length)
        });

        root.innerHTML = filteredItems.length
          ? viewMode === 'calendar'
            ? renderProgramCalendar(filteredItems)
            : filteredItems.map(item => `
              <article class="card" data-program-name="${escapeAttributeValue(item.name)}">
                <span class="badge">${translate('programBadge')}</span>
                <h3>${escapeAttributeValue(item.name)}</h3>
                ${detailMode === 'full' ? `<p>${escapeAttributeValue(item.desc || '')}</p>` : ''}
                <div class="meta">
                  <a href="#" class="chip chip-link" data-location="${escapeAttributeValue(item.location || '')}">${escapeAttributeValue(item.location || '')}</a>
                  <span class="chip">${formatProgramDate(item.date)}</span>
                  <span class="chip">${item.start} - ${item.end}</span>
                  <span class="chip">${translate('minutes', { count: item.duration })}</span>
                </div>
                ${detailMode === 'full' ? `
                  <div class="meta">
                    ${(item.languages || []).map(lang => `<span class="chip">${escapeAttributeValue(lang)}</span>`).join('')}
                  </div>
                  <p><strong>${translate('contributors')}</strong></p>
                  <ul>${(item.contributers || []).map(name => `<li>${escapeAttributeValue(name)}</li>`).join('')}</ul>
                ` : ''}
                ${renderLikeControl(item, 'program')}
                ${renderItemEditor(item, 'program')}
                ${renderDeleteControl(item, 'program')}
              </article>
            `).join('')
          : `<p class="loading">${translate('programNoMatches')}</p>`;

        attachLikeHandlers(root);
        attachItemEditorHandlers(root);
        attachDeleteHandlers(root);
        document.querySelectorAll('[data-location]').forEach(link => {
          link.addEventListener('click', (event) => {
            event.preventDefault();
            const name = event.currentTarget.dataset.location;
            openLocationTab(name);
          });
        });
      }

      function renderTopics(items, selectedLanguage = 'all', sortMode = 'date', showOnlyTopics = false, detailMode = 'full', searchText = '', likedBy = 'all') {
        const root = document.getElementById('topics-cards');
        const topicItems = (selectedLanguage === 'all'
          ? items
          : items.filter(item => (item.languages || []).includes(selectedLanguage)))
          .filter(item => matchesSearch(item, searchText))
          .filter(item => matchesLikedBy(item, likedBy, 'topics'))
          .slice();

        const programItems = (selectedLanguage === 'all'
          ? window.allProgramItems || []
          : (window.allProgramItems || []).filter(item => (item.languages || []).includes(selectedLanguage)))
          .filter(item => matchesSearch(item, searchText))
          .filter(item => matchesLikedBy(item, likedBy, 'program'))
          .slice();

        const mergedItems = showOnlyTopics ? topicItems : [...programItems, ...topicItems];

        const sortedItems = mergedItems.slice().sort((a, b) => {
          if (sortMode === 'likes') {
            const typeA = a.date ? 'program' : 'topics';
            const typeB = b.date ? 'program' : 'topics';
            return getItemLikeState(b, typeB).likeCount - getItemLikeState(a, typeA).likeCount || a.name.localeCompare(b.name);
          }

          if (sortMode === 'name') {
            return a.name.localeCompare(b.name);
          }

          const dateA = a.date || '0000-00-00';
          const dateB = b.date || '0000-00-00';
          const timeA = a.start || '00:00';
          const timeB = b.start || '00:00';
          const sortA = `${dateA}T${timeA}:00`;
          const sortB = `${dateB}T${timeB}:00`;
          return new Date(sortA) - new Date(sortB);
        });

        document.getElementById('topics-item-count').textContent = translate('itemsShown', {
          count: new Intl.NumberFormat(getPageCollationLocale()).format(sortedItems.length)
        });

        root.innerHTML = sortedItems.length
          ? sortedItems.map(item => {
              const isProgram = !!item.date;
              return `
                <article class="card">
                  <span class="badge">${translate(isProgram ? 'programBadge' : 'topicBadge')}</span>
                  <h3>${escapeAttributeValue(item.name)}</h3>
                  ${detailMode === 'full' ? `<p>${escapeAttributeValue(item.desc || '')}</p>` : ''}
                  ${isProgram ? `
                    <div class="meta">
                      <a href="#" class="chip chip-link" data-location="${escapeAttributeValue(item.location || '')}">${escapeAttributeValue(item.location || '')}</a>
                      <span class="chip">${formatProgramDate(item.date)}</span>
                      <span class="chip">${item.start} - ${item.end}</span>
                      <span class="chip">${translate('minutes', { count: item.duration })}</span>
                    </div>
                  ` : ''}
                  ${detailMode === 'full' ? `
                    <div class="meta">
                      ${(item.languages || []).map(lang => `<span class="chip">${escapeAttributeValue(lang)}</span>`).join('')}
                    </div>
                    <p><strong>${translate('contributors')}</strong></p>
                    <ul>${(item.contributers || []).map(name => `<li>${escapeAttributeValue(name)}</li>`).join('')}</ul>
                  ` : ''}
                  ${renderLikeControl(item, isProgram ? 'program' : 'topics')}
                  ${renderItemEditor(item, isProgram ? 'program' : 'topics')}
                  ${renderDeleteControl(item, isProgram ? 'program' : 'topics')}
                </article>
              `;
            }).join('')
          : `<p class="loading">${translate('itemsNoMatches')}</p>`;

        attachLikeHandlers(root);
        attachItemEditorHandlers(root);
        attachDeleteHandlers(root);
        document.querySelectorAll('[data-location]').forEach(link => {
          link.addEventListener('click', (event) => {
            event.preventDefault();
            const name = event.currentTarget.dataset.location;
            openLocationTab(name);
          });
        });
      }

      function renderLocationEditor(location) {
        return `
          <details class="item-editor">
            <summary>${translate('editItem')}</summary>
            <form class="item-editor-form location-editor-form" data-location-name="${escapeAttributeValue(location.name)}">
              <div class="item-editor-fields">
                <div class="item-editor-field">
                  <label>${translate('name')}</label>
                  <input name="name" type="text" maxlength="160" value="${escapeAttributeValue(location.name)}" required />
                </div>
                <div class="item-editor-field">
                  <label>${translate('capacity')}</label>
                  <input name="capacity" type="number" min="1" max="100000" step="1" value="${location.capacity ?? ''}" />
                </div>
                <div class="item-editor-field item-editor-description">
                  <label>${translate('topicDescription')}</label>
                  <textarea name="description" rows="3" maxlength="4000" required>${escapeAttributeValue(location.desc || '')}</textarea>
                </div>
                <div class="item-editor-field item-editor-description">
                  <label>${translate('facilities')}</label>
                  <input name="facilities" type="text" value="${escapeAttributeValue((location.facilities || []).join(', '))}" />
                </div>
              </div>
              <button class="save-item" type="submit">${translate('saveLocation')}</button>
              <p class="item-editor-status" role="status" aria-live="polite"></p>
            </form>
          </details>
        `;
      }

      async function saveLocation(form) {
        const formData = new FormData(form);
        const status = form.querySelector('.item-editor-status');
        const saveButton = form.querySelector('.save-item');
        const splitValues = value => value.split(',').map(part => part.trim()).filter(Boolean);
        saveButton.disabled = true;
        status.textContent = '';

        try {
          const response = await fetch(eventApiUrl('/api/locations'), {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              itemName: form.dataset.locationName,
              name: formData.get('name'),
              description: formData.get('description'),
              capacity: formData.get('capacity') ? Number(formData.get('capacity')) : null,
              facilities: splitValues(formData.get('facilities'))
            })
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || translate('locationSaveFailed'));

          window.allLocations = (window.allLocations || []).map(location =>
            location.name === result.previousName ? result.location : location
          );
          window.allProgramItems = (window.allProgramItems || []).map(item =>
            item.location === result.previousName
              ? { ...item, location: result.location.name }
              : item
          );
          renderCurrentViews();
          renderLocations(window.allLocations);
          document.getElementById('user-name-status').textContent = translate('locationSaved');
        } catch (error) {
          status.textContent = error.message || translate('locationSaveFailed');
        } finally {
          if (saveButton.isConnected) saveButton.disabled = false;
        }
      }

      function initializeLocationCreation() {
        const form = document.getElementById('create-location-form');
        const submitButton = form.querySelector('button[type="submit"]');
        const status = document.getElementById('location-create-status');

        form.addEventListener('submit', async event => {
          event.preventDefault();
          submitButton.disabled = true;
          status.textContent = '';
          const formData = new FormData(form);
          const splitValues = value => value.split(',').map(part => part.trim()).filter(Boolean);

          try {
            const response = await fetch(eventApiUrl('/api/locations'), {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                name: formData.get('name'),
                description: formData.get('description'),
                capacity: formData.get('capacity') ? Number(formData.get('capacity')) : null,
                facilities: splitValues(formData.get('facilities'))
              })
            });
            const result = await response.json();
            if (!response.ok) throw new Error(result.error || translate('locationSaveFailed'));

            window.allLocations.push(result.location);
            renderLocations(window.allLocations);
            form.reset();
            status.textContent = translate('locationSaved');
            form.closest('details').open = false;
          } catch (error) {
            status.textContent = error.message || translate('locationSaveFailed');
          } finally {
            submitButton.disabled = false;
          }
        });
      }

      function attachLocationEditorHandlers(root) {
        root.querySelectorAll('.location-editor-form').forEach(form => {
          form.addEventListener('submit', event => {
            event.preventDefault();
            saveLocation(form);
          });
        });
      }

      function renderLocations(items) {
        const root = document.getElementById('locations-cards');
        const programItems = window.allProgramItems || [];
        root.innerHTML = items.map(location => {
          const matchingItems = programItems.filter(programItem => programItem.location === location.name);
          const programNames = matchingItems.length
            ? matchingItems.map(programItem => `
                <li>
                  <a href="#" class="program-item-link" data-program-item="${escapeAttributeValue(programItem.name)}">${escapeAttributeValue(programItem.name)}</a><br>
                  ${escapeAttributeValue(programItem.date || '')} • ${escapeAttributeValue(programItem.start || '')} - ${escapeAttributeValue(programItem.end || '')}
                </li>
              `).join('')
            : `<li>${translate('noProgramItems')}</li>`;

          return `
            <article id="location-${escapeAttributeValue(location.name)}" class="card">
              <span class="badge">${translate('locationBadge')}</span>
              <h3>${escapeAttributeValue(location.name)}</h3>
              <p>${escapeAttributeValue(location.desc || '')}</p>
              ${location.capacity != null ? `<p><strong>${translate('capacity')}</strong> ${location.capacity}</p>` : ''}
              ${(location.facilities || []).length ? `
                <p><strong>${translate('facilities')}</strong></p>
                <div class="meta">
                  ${location.facilities.map(facility => `<span class="chip">${escapeAttributeValue(facility)}</span>`).join('')}
                </div>
              ` : ''}
              ${renderLocationEditor(location)}
              <p><strong>${translate('programItems')}</strong></p>
              <ul>${programNames}</ul>
            </article>
          `;
        }).join('');

        attachLocationEditorHandlers(root);
        root.onclick = event => {
          const link = event.target.closest('[data-program-item]');
          if (!link) return;

          event.preventDefault();
          openProgramItem(link.dataset.programItem);
        };
      }

      function openLocationTab(locationName) {
        const tabs = document.querySelectorAll('.tab');
        const sections = document.querySelectorAll('.section');

        tabs.forEach(tab => tab.classList.toggle('active', tab.dataset.tab === 'locations'));
        sections.forEach(section => {
          section.classList.toggle('active', section.id === 'locations-section');
        });

        const target = document.getElementById(`location-${locationName}`);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      function openProgramItem(programName) {
        const programLanguageFilter = document.getElementById('program-language-filter');
        const programLikedFilter = document.getElementById('program-liked-filter');
        const programSearch = document.getElementById('program-search-filter');
        programLanguageFilter.value = 'all';
        programLikedFilter.value = 'all';
        programSearch.value = '';
        renderProgram(window.allProgramItems || [], 'all', document.getElementById('program-detail-filter').value, '', 'all');

        document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab.dataset.tab === 'program'));
        document.querySelectorAll('.section').forEach(section => {
          section.classList.toggle('active', section.id === 'program-section');
        });

        const target = Array.from(document.querySelectorAll('[data-program-name]'))
          .find(card => card.dataset.programName === programName);
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      document.querySelectorAll('.tab').forEach(button => {
        button.addEventListener('click', () => {
          const selectedTab = button.dataset.tab;

          document.querySelectorAll('.tab').forEach(tab => tab.classList.toggle('active', tab === button));
          document.querySelectorAll('.section').forEach(section => {
            section.classList.toggle('active', section.id === `${selectedTab}-section`);
          });
        });
      });

      initializePageLanguage();
      initializeUserName();
      initializeEventFlow();
      initializeTopicCreation();
      initializeLocationCreation();
    </script>
  </body>
</html>
