<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Space</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #2d6cdf;
        --primary-soft: #eaf1ff;
        --text: #1e293b;
        --muted: #64748b;
        --border: #dfe7f3;
        --success: #16a34a;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 0 20px 40px;
      }

      h1 {
        font-size: 2.2rem;
        margin-bottom: 8px;
      }

      .subtitle {
        color: var(--muted);
        margin-bottom: 30px;
      }

      .tab-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin: 24px 0 28px;
      }

      .tab {
        border: 1px solid var(--border);
        background: #fff;
        color: var(--text);
        border-radius: 999px;
        padding: 10px 18px;
        cursor: pointer;
        font-weight: 700;
        transition: all 0.2s ease;
      }

      .tab.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .section {
        display: none;
        margin-bottom: 40px;
      }

      .section.active {
        display: block;
      }

      .section h2 {
        font-size: 1.5rem;
        margin-bottom: 18px;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 20px;
        box-shadow: 0 3px 12px rgba(15, 23, 42, 0.04);
      }

      .badge {
        display: inline-block;
        background: var(--primary-soft);
        color: var(--primary);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .card h3 {
        margin: 0 0 10px;
        font-size: 1.2rem;
      }

      .card p {
        margin: 8px 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .filter-bar {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .item-count {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .filter-group {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        flex: 0 0 auto;
        gap: 10px;
      }

      #program-detail-filter-group[hidden] {
        display: none;
      }

      .filter-bar label {
        font-weight: 700;
        white-space: nowrap;
      }

      .filter-bar select,
      .filter-bar input {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        background: white;
        color: var(--text);
        min-width: 150px;
        font: inherit;
      }

      #program-search-filter,
      #topics-search-filter {
        width: 320px;
      }

      .save-status {
        color: var(--muted);
        font-size: 0.875rem;
      }

      .sort-bar {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .sort-bar label {
        font-weight: 700;
        white-space: nowrap;
      }

      .sort-bar select {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 12px;
        background: white;
        color: var(--text);
        min-width: 180px;
      }

      .topic-create {
        margin-bottom: 20px;
      }

      .topic-create summary {
        color: var(--primary);
        cursor: pointer;
        font-weight: 700;
        padding: 8px 0;
      }

      .topic-create form {
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }

      .topic-create-fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
        margin-bottom: 14px;
      }

      .topic-create-field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .topic-create-field label {
        font-weight: 700;
      }

      .topic-create-field input,
      .topic-create-field textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
        background: white;
        color: var(--text);
        font: inherit;
      }

      .topic-create-field textarea {
        resize: vertical;
      }

      .topic-create-description {
        grid-column: 1 / -1;
      }

      .topic-create button {
        border: 1px solid var(--primary);
        border-radius: 6px;
        padding: 9px 14px;
        background: var(--primary);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .topic-create button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .topic-create-status {
        min-height: 1.2em;
        margin: 4px 0 0;
        color: var(--muted);
      }

      .delete-item {
        border: 1px solid #b91c1c;
        border-radius: 6px;
        padding: 6px 10px;
        background: white;
        color: #b91c1c;
        font: inherit;
        cursor: pointer;
      }

      .delete-item:disabled {
        cursor: wait;
        opacity: 0.6;
      }

      .item-editor {
        margin-top: 14px;
      }

      .item-editor summary {
        color: var(--primary);
        cursor: pointer;
        font-weight: 700;
      }

      .item-editor-form {
        display: grid;
        gap: 12px;
        padding-top: 12px;
      }

      .item-editor-fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 12px;
      }

      .item-editor-field {
        display: grid;
        gap: 6px;
        min-width: 0;
      }

      .item-editor-field label,
      .item-editor-move {
        font-weight: 700;
      }

      .item-editor-field input,
      .item-editor-field textarea,
      .item-editor-field select {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
        background: white;
        color: var(--text);
        font: inherit;
      }

      .item-editor-field textarea {
        resize: vertical;
      }

      .item-editor-description {
        grid-column: 1 / -1;
      }

      .item-editor-schedule {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 12px;
      }

      .item-editor-schedule[hidden] {
        display: none;
      }

      .item-editor-form .save-item {
        justify-self: start;
        border: 1px solid var(--primary);
        border-radius: 6px;
        padding: 9px 14px;
        background: var(--primary);
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .item-editor-form .save-item:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      .item-editor-status {
        min-height: 1.2em;
        margin: 0;
        color: var(--muted);
      }

      @media (max-width: 480px) {
        .container {
          padding-right: 12px;
          padding-left: 12px;
        }

        .filter-bar select,
        .filter-bar input,
        .sort-bar select {
          width: min(145px, 40vw);
          min-width: 0;
        }

        .filter-group-mobile-wide {
          flex: 1 1 100%;
          flex-direction: column;
          align-items: stretch;
          width: 100%;
          gap: 6px;
        }

        .filter-group-mobile-wide select,
        .filter-group-mobile-wide input {
          width: 100%;
        }

        #program-search-filter,
        #topics-search-filter {
          width: 100%;
        }
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .chip {
        background: #f8fafc;
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      .chip-link {
        display: inline-block;
        text-decoration: none;
        color: var(--primary);
        cursor: pointer;
      }

      .chip-link:hover {
        text-decoration: underline;
      }

      .likes {
        color: var(--success);
        font-weight: 700;
      }

      .like-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 14px;
      }

      .like-toggle {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 6px 10px;
        background: #fff;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      .like-toggle[aria-pressed="true"] {
        color: var(--success);
        border-color: var(--success);
      }

      .like-toggle:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .like-actions .likes {
        margin: 0;
      }

      ul {
        margin: 10px 0 0;
        padding-left: 18px;
        color: var(--text);
      }

      li {
        margin: 4px 0;
      }

      .loading {
        color: var(--muted);
        font-size: 1rem;
      }

      .program-calendar {
        display: grid;
        grid-column: 1 / -1;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
        align-items: start;
      }

      .calendar-day {
        min-width: 0;
        padding: 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .calendar-day h3 {
        margin: 0 0 14px;
        font-size: 1rem;
      }

      .calendar-events {
        display: grid;
        gap: 10px;
      }

      .calendar-event {
        display: grid;
        gap: 5px;
        padding: 10px;
        border-left: 3px solid var(--primary);
        background: var(--primary-soft);
        border-radius: 4px;
      }

      .calendar-time {
        color: var(--muted);
        font-size: 0.85rem;
        font-weight: 700;
      }

      .event-controls {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin: 20px 0;
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel);
      }

      .event-controls[hidden],
      .setup-overlay[hidden] {
        display: none;
      }

      .event-controls details {
        margin-left: auto;
      }

      .setup-overlay {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        overflow-y: auto;
        padding: 20px;
        background: rgba(15, 23, 42, 0.62);
      }

      .setup-card {
        width: min(100%, 520px);
        padding: 28px;
        border-radius: 16px;
        background: var(--panel);
        box-shadow: 0 16px 48px rgba(15, 23, 42, 0.25);
      }

      .setup-card form {
        display: grid;
        gap: 14px;
      }

      .setup-card label {
        display: grid;
        gap: 6px;
        font-weight: 700;
      }

      .setup-card input,
      .setup-card select {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 12px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      .setup-card button,
      .event-controls button {
        border: 0;
        border-radius: 8px;
        padding: 10px 14px;
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      .setup-card button:disabled,
      .event-controls button:disabled {
        opacity: 0.6;
        cursor: wait;
      }

      .setup-card details {
        margin-top: 20px;
      }

      .setup-card summary,
      .event-controls summary {
        cursor: pointer;
        font-weight: 700;
      }

      .setup-status {
        min-height: 1.4em;
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <div id="event-setup-overlay" class="setup-overlay" role="dialog" aria-modal="true" aria-labelledby="setup-heading">
      <div class="setup-card">
        <section id="profile-setup-step">
          <h2 id="setup-heading" data-i18n="profileSetup">Tell us about yourself</h2>
          <form id="profile-setup-form">
            <label for="setup-user-name" data-i18n="yourName">Your name:</label>
            <input id="setup-user-name" type="text" maxlength="120" autocomplete="name" required />
            <label for="setup-favorite-language" data-i18n="favoriteLanguage">Favorite language</label>
            <select id="setup-favorite-language" required></select>
            <button type="submit" data-i18n="continueToEvents">Continue</button>
          </form>
        </section>
        <section id="event-setup-step" hidden>
          <h2 data-i18n="chooseEvent">Choose an event</h2>
          <form id="event-select-form">
            <label for="event-select" data-i18n="selectEvent">Select an event</label>
            <select id="event-select" required></select>
            <button type="submit" data-i18n="openEvent">Open event</button>
          </form>
          <details>
            <summary data-i18n="createEvent">Create a new event</summary>
            <form id="event-create-form">
              <label for="new-event-name" data-i18n="eventName">Event name</label>
              <input id="new-event-name" name="name" type="text" maxlength="160" required />
              <button type="submit" data-i18n="addEvent">Create event</button>
            </form>
          </details>
          <p id="event-setup-status" class="setup-status" role="status" aria-live="polite"></p>
        </section>
      </div>
    </div>
    <div class="container">
      <h1 data-i18n="openSpace">Open Space</h1>
      <p class="subtitle" data-i18n="welcome">Welcome to Open Space!</p>
      <div id="event-controls" class="event-controls" hidden>
        <strong><span data-i18n="currentEvent">Current event:</span> <span id="current-event-name"></span></strong>
        <button id="switch-event-button" type="button" data-i18n="switchEvent">Switch event</button>
        <details>
          <summary data-i18n="manageEvent">Manage event</summary>
          <form id="event-rename-form">
            <label for="managed-event-name" data-i18n="eventName">Event name</label>
            <input id="managed-event-name" name="name" type="text" maxlength="160" required />
            <button type="submit" data-i18n="saveEvent">Save event</button>
            <button id="delete-event-button" type="button" data-i18n="deleteEvent">Delete event</button>
            <p id="event-manage-status" class="setup-status" role="status" aria-live="polite"></p>
          </form>
        </details>
      </div>
      <div class="filter-bar">
        <div class="filter-group">
          <label for="current-user-name" data-i18n="yourName">Your name:</label>
          <input id="current-user-name" type="text" autocomplete="name" placeholder="Enter your name" data-i18n-placeholder="enterName" />
        </div>
        <div class="filter-group">
          <label for="page-language-filter" data-i18n="pageLanguage">Your language:</label>
          <select id="page-language-filter">
            <option value="en">English</option>
            <option value="de">Deutsch</option>
            <option value="fr">Français</option>
            <option value="es">Español</option>
            <option value="it">Italiano</option>
            <option value="sq">Shqip</option>
            <option value="nds">Plattdüütsch</option>
            <option value="fy">Frysk</option>
            <option value="bar">Boarisch</option>
            <option value="frk">Fränkisch</option>
            <option value="hes">Hessisch</option>
            <option value="ksh">Kölsch</option>
            <option value="ar">العربية</option>
            <option value="he">עברית</option>
          </select>
        </div>
        <span id="user-name-status" class="save-status" role="status" aria-live="polite"></span>
      </div>

      <div class="tab-bar">
        <button class="tab active" data-tab="program" data-i18n="program">Program</button>
        <button class="tab" data-tab="topics" data-i18n="topics">Topics</button>
        <button class="tab" data-tab="locations" data-i18n="locations">Locations</button>
      </div>

      <section id="program-section" class="section active">
        <h2 data-i18n="program">Program</h2>
        <div class="filter-bar">
          <div class="filter-group">
            <label for="program-language-filter" data-i18n="language">Language:</label>
            <select id="program-language-filter">
              <option value="all" data-i18n="all" selected>All</option>
            </select>
          </div>
          <div class="filter-group filter-group-mobile-wide">
            <label for="program-liked-filter" data-i18n="filter">Filter:</label>
            <select id="program-liked-filter">
              <option value="all" data-i18n="all" selected>All</option>
            </select>
          </div>
          <div class="filter-group filter-group-mobile-wide">
            <label for="program-search-filter" data-i18n="search">Search:</label>
            <input id="program-search-filter" type="search" placeholder="Name, description, contributor" data-i18n-placeholder="searchPlaceholder" />
          </div>
          <div class="filter-group">
            <label for="program-view-filter" data-i18n="view">View:</label>
            <select id="program-view-filter">
              <option value="list" data-i18n="list" selected>List</option>
              <option value="calendar" data-i18n="calendar">Calendar</option>
            </select>
          </div>
          <div id="program-detail-filter-group" class="filter-group">
            <label for="program-detail-filter" data-i18n="details">Details:</label>
            <select id="program-detail-filter">
              <option value="full" data-i18n="full" selected>Full</option>
              <option value="compact" data-i18n="compact">Compact</option>
            </select>
          </div>
        </div>
        <p id="program-item-count" class="item-count" aria-live="polite"></p>
        <div id="program-cards" class="cards">
          <div class="loading" data-i18n="loadingProgram">Loading program...</div>
        </div>
      </section>

      <section id="topics-section" class="section">
        <h2 data-i18n="topics">Topics</h2>
        <div class="filter-bar">
          <div class="filter-group">
            <label for="topics-language-filter" data-i18n="language">Language:</label>
            <select id="topics-language-filter">
              <option value="all" data-i18n="all" selected>All</option>
            </select>
          </div>
          <div class="filter-group filter-group-mobile-wide">
            <label for="topics-liked-filter" data-i18n="filter">Filter:</label>
            <select id="topics-liked-filter">
              <option value="all" data-i18n="all" selected>All</option>
            </select>
          </div>
          <div class="filter-group filter-group-mobile-wide">
            <label for="topics-search-filter" data-i18n="search">Search:</label>
            <input id="topics-search-filter" type="search" placeholder="Name, description, contributor" data-i18n-placeholder="searchPlaceholder" />
          </div>
          <div class="filter-group">
            <label for="topics-detail-filter" data-i18n="details">Details:</label>
            <select id="topics-detail-filter">
              <option value="full" data-i18n="full" selected>Full</option>
              <option value="compact" data-i18n="compact">Compact</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="topics-type-filter" data-i18n="show">Show:</label>
            <select id="topics-type-filter">
              <option value="all" data-i18n="allItems" selected>All items</option>
              <option value="topics-only" data-i18n="topicsOnly">Topics only</option>
            </select>
          </div>
        </div>
        <div class="sort-bar">
          <div class="filter-group">
            <label for="topics-sort-select" data-i18n="sortBy">Sort by:</label>
            <select id="topics-sort-select">
              <option value="date" data-i18n="date" selected>Date</option>
              <option value="likes" data-i18n="likes">Likes</option>
              <option value="name" data-i18n="name">Name</option>
            </select>
          </div>
        </div>
        <p id="topics-item-count" class="item-count" aria-live="polite"></p>
        <details class="topic-create">
          <summary data-i18n="createTopic">Create a topic</summary>
          <form id="create-topic-form">
            <div class="topic-create-fields">
              <div class="topic-create-field">
                <label for="new-topic-name" data-i18n="name">Name</label>
                <input id="new-topic-name" name="name" type="text" maxlength="160" required />
              </div>
              <div class="topic-create-field topic-create-description">
                <label for="new-topic-description" data-i18n="topicDescription">Description:</label>
                <textarea id="new-topic-description" name="description" rows="3" maxlength="4000" required></textarea>
              </div>
              <div class="topic-create-field">
                <label for="new-topic-contributors" data-i18n="contributors">Contributors:</label>
                <input id="new-topic-contributors" name="contributors" type="text" />
              </div>
              <div class="topic-create-field">
                <label for="new-topic-languages" data-i18n="language">Language:</label>
                <input id="new-topic-languages" name="languages" type="text" />
              </div>
            </div>
            <button type="submit" data-i18n="addTopic">Add topic</button>
          </form>
        </details>
        <p id="topic-create-status" class="topic-create-status" role="status" aria-live="polite"></p>
        <div id="topics-cards" class="cards">
          <div class="loading" data-i18n="loadingTopics">Loading topics...</div>
        </div>
      </section>

      <section id="locations-section" class="section">
        <h2 data-i18n="locations">Locations</h2>
        <details class="topic-create">
          <summary data-i18n="createLocation">Create a location</summary>
          <form id="create-location-form">
            <div class="topic-create-fields">
              <div class="topic-create-field">
                <label for="new-location-name" data-i18n="name">Name</label>
                <input id="new-location-name" name="name" type="text" maxlength="160" required />
              </div>
              <div class="topic-create-field">
                <label for="new-location-capacity" data-i18n="capacity">Capacity:</label>
                <input id="new-location-capacity" name="capacity" type="number" min="1" max="100000" step="1" />
              </div>
              <div class="topic-create-field topic-create-description">
                <label for="new-location-description" data-i18n="topicDescription">Description:</label>
                <textarea id="new-location-description" name="description" rows="3" maxlength="4000" required></textarea>
              </div>
              <div class="topic-create-field topic-create-description">
                <label for="new-location-facilities" data-i18n="facilities">Facilities:</label>
                <input id="new-location-facilities" name="facilities" type="text" />
              </div>
            </div>
            <button type="submit" data-i18n="addLocation">Add location</button>
